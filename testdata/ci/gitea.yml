# Managed by 'arc init --ci gitea'; rerunning it overwrites this file.
# Delete the line above to take ownership of the file.
#
# Installs the arc that wrote this file; rerun 'arc init --ci gitea' after
# upgrading arc to move the pin.
name: arc
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # arc gate --base needs the base branch history
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install arc
        run: go install github.com/Yalton/arc/cmd/arc@v1.2.3
      - name: arc gate (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: arc gate --base "origin/$BASE_REF"
      - name: arc gate (whole tree)
        if: github.event_name != 'pull_request'
        run: arc gate --all
